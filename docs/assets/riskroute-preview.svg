    </clipPath>
    <clipPath id="mapClip">
      <rect x="785" y="205" width="515" height="265" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1440" height="860" fill="url(#canvas)"/>
  <rect width="1440" height="860" fill="url(#dots)"/>

